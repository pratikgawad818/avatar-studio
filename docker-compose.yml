version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: avatar-studio-db
    environment:
      POSTGRES_DB: avatar_studio
      POSTGRES_USER: avatar_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar_user -d avatar_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: avatar-studio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: avatar-studio-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://avatar_user:${DB_PASSWORD:-changeme}@db/avatar_studio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "False"
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python backend/main.py

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: avatar-studio-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://avatar_user:${DB_PASSWORD:-changeme}@db/avatar_studio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: celery -A backend.celery_app worker --loglevel=info

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: avatar-studio-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8002/api

volumes:
  postgres_data:

networks:
  default:
    name: avatar-studio-network
